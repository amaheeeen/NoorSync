<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062e28" />
      <stop offset="100%" stop-color="#041210" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#mintGrad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Crescent Moon Symbol -->
  <path d="M 256 120 A 136 136 0 1 0 392 256 A 120 120 0 1 1 256 120 Z" 
        fill="url(#goldGrad)" 
        filter="url(#softGlow)" />

  <!-- 8-Point Rub el Hizb / Islamic Star -->
  <g transform="translate(300, 190) scale(0.65)" filter="url(#softGlow)">
    <polygon points="0,-40 28,-28 40,0 28,28 0,40 -28,28 -40,0 -28,-28" fill="url(#mintGrad)" opacity="0.95" />
    <polygon points="-28,-28 0,-40 28,-28 40,0 28,28 0,40 -28,28 -40,0" fill="url(#goldGrad)" transform="rotate(45)" opacity="0.85" />
    <circle cx="0" cy="0" r="12" fill="#041210" />
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Center Kaaba Motif -->
  <rect x="226" y="270" width="60" height="60" rx="8" fill="#041210" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="226" y="282" width="60" height="6" fill="url(#goldGrad)" />
</svg>
